<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember Vault: Afterlight</title>
<style>
:root{--bg:#11151a;--panel:#1b232b;--panel2:#222d36;--ink:#e8f0e5;--muted:#9eada5;--accent:#ffb84a;--good:#6de38b;--bad:#ff6b6b;--cyan:#62d8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#26343d,#0e1216 60%);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif}button{background:#2b3943;color:var(--ink);border:1px solid #465764;border-radius:7px;padding:9px 12px;cursor:pointer;font-weight:700}button:hover{background:#374954}button:disabled{opacity:.4;cursor:not-allowed}
#app{max-width:1250px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);padding:12px 16px;border-radius:12px;border:1px solid #34424c;position:sticky;top:8px;z-index:5}.brand{font-size:22px;font-weight:900;color:var(--accent)}.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.stat b{color:var(--accent)}
.grid{display:grid;grid-template-columns:1.5fr .9fr;gap:14px;margin-top:14px}.panel{background:rgba(27,35,43,.96);border:1px solid #34424c;border-radius:12px;padding:14px}.panel h2,.panel h3{margin:0 0 10px}.tabs{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}.tab.active{background:var(--accent);color:#17120b;border-color:#ffd27b}.roomgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.room{min-height:105px;background:var(--panel2);border:1px solid #3d4b55;border-radius:9px;padding:9px;position:relative}.room.empty{border-style:dashed;opacity:.75}.room .lvl{position:absolute;right:7px;top:7px;color:var(--accent);font-size:12px}.room .icon{font-size:25px}.room small{color:var(--muted);display:block}.meter{height:8px;background:#101519;border-radius:99px;overflow:hidden;margin:5px 0}.meter i{display:block;height:100%;background:var(--good)}.list{display:grid;gap:8px;max-height:440px;overflow:auto}.card{background:var(--panel2);border:1px solid #3d4b55;border-radius:8px;padding:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:11px;border-radius:20px;padding:3px 7px;background:#30404a;color:var(--cyan)}.muted{color:var(--muted)}.log{height:130px;overflow:auto;background:#0d1216;padding:9px;border-radius:8px;font-size:12px}.log div{margin-bottom:5px}.quest{border-left:3px solid var(--accent)}.controls{display:flex;gap:6px;flex-wrap:wrap}.danger{color:var(--bad)}.good{color:var(--good)}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.zone{height:70px;background:#253039;border:1px solid #40505a;border-radius:6px;padding:7px;font-size:11px}.zone.done{background:#24412e;border-color:#4c9e62}.zone.active{outline:2px solid var(--accent)}.footer{text-align:center;color:#77858d;font-size:11px;padding:18px}.toast{position:fixed;right:18px;bottom:18px;background:#24333c;border:1px solid #52636e;padding:12px 16px;border-radius:8px;display:none;z-index:9}.hero{background:linear-gradient(135deg,#17232a,#0d1115);border:1px solid #40515b;border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -40px -70px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ffb84a33,transparent 65%)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#183a2a;color:#78ef9a;font-size:11px;font-weight:900;letter-spacing:.08em}.cutscene{position:fixed;inset:0;background:rgba(4,7,9,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.scene{max-width:780px;width:100%;background:#131b20;border:1px solid #566773;border-radius:16px;box-shadow:0 20px 80px #000;padding:0;overflow:hidden}.scene-art{height:230px;background:linear-gradient(#263b45,#0c1115);position:relative}.scene-art:before{content:"";position:absolute;left:12%;right:12%;bottom:22px;height:82px;border:4px solid #8ea4ad;border-radius:50% 50% 10px 10px/35% 35% 10px 10px;box-shadow:0 -28px 0 -18px #ffb84a}.scene-copy{padding:20px}.scene-copy h2{font-size:28px;margin:0 0 8px}.scene-copy p{color:#b9c7c0;line-height:1.6}.chapter{color:#ffb84a;font-weight:900;text-transform:uppercase;letter-spacing:.14em;font-size:12px}.visual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vcard{min-height:90px;border:1px solid #40515b;border-radius:10px;padding:10px;background:linear-gradient(145deg,#26343d,#182127);position:relative;overflow:hidden}.vcard .big{font-size:32px}.vcard:after{content:"";position:absolute;width:70px;height:70px;right:-20px;bottom:-25px;border-radius:50%;background:#ffb84a18}@media(max-width:600px){.visual-grid{grid-template-columns:1fr}.scene-art{height:170px}}
@media(max-width:850px){.grid{grid-template-columns:1fr}.roomgrid{grid-template-columns:repeat(2,1fr)}.top{position:static}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div><div id="cutscene" class="cutscene"><div class="scene"><div class="scene-art"></div><div class="scene-copy"><div id="sceneChapter" class="chapter"></div><h2 id="sceneTitle"></h2><p id="sceneText"></p><div class="controls"><button onclick="closeScene()">Continue</button></div></div></div></div>
<script>
const TYPES={
hab:{name:"Habitat",icon:"🛏️",cost:{scrap:40,food:10,water:5},cap:2,desc:"Living quarters. Houses two dwellers."},
farm:{name:"Grow Bay",icon:"🌱",cost:{scrap:55,food:0,water:8},prod:"food",rate:4,desc:"Produces food."},
pump:{name:"Purifier",icon:"💧",cost:{scrap:55,food:0,water:0},prod:"water",rate:4,desc:"Produces clean water."},
reactor:{name:"Reactor",icon:"⚡",cost:{scrap:80,food:0,water:0},prod:"power",rate:5,desc:"Produces power."},
workshop:{name:"Forge",icon:"🔧",cost:{scrap:90,food:0,water:0},prod:"gear",rate:1,desc:"Crafts equipment."},
medbay:{name:"Med Bay",icon:"🩺",cost:{scrap:75,food:0,water:4},prod:"med",rate:1,desc:"Produces med kits."},
training:{name:"Training Hall",icon:"🎯",cost:{scrap:100,food:0,water:0},prod:"xp",rate:2,desc:"Trains assigned dwellers."},
scout:{name:"Scout Hub",icon:"🛰️",cost:{scrap:120,food:0,water:0},desc:"Unlocks longer quests."},
armory:{name:"Armory",icon:"🛡️",cost:{scrap:150,food:0,water:0},prod:"gear",rate:2,desc:"Maintains advanced equipment."},
hydro:{name:"Hydroponics Lab",icon:"🧪",cost:{scrap:170,food:0,water:12},prod:"food",rate:7,desc:"High-yield food production."},
command:{name:"Command Deck",icon:"🧭",cost:{scrap:210,food:10,water:10},desc:"Improves expedition coordination."},
reactor2:{name:"Fusion Core",icon:"☢️",cost:{scrap:260,food:0,water:0},prod:"power",rate:10,desc:"High-output clean energy."},
clinic:{name:"Trauma Clinic",icon:"🏥",cost:{scrap:220,food:0,water:8},prod:"med",rate:3,desc:"Advanced medical care."},
archive:{name:"Memory Archive",icon:"📚",cost:{scrap:180,food:0,water:0},prod:"xp",rate:4,desc:"Preserves knowledge and trains dwellers."}
};
const WEAPONS=[
{name:"Pipe Carbine",d:9,cost:{scrap:30},icon:"🔫"},{name:"Arc Pistol",d:13,cost:{scrap:50},icon:"⚡"},{name:"Coil Rifle",d:19,cost:{scrap:80},icon:"🎯"},{name:"Ember Blaster",d:27,cost:{scrap:130},icon:"🔥"},{name:"Storm Hammer",d:34,cost:{scrap:170},icon:"🔨"},{name:"Rail Spear",d:42,cost:{scrap:230},icon:"🗡️"},{name:"Sunburst Carbine",d:51,cost:{scrap:310},icon:"☀️"},{name:"Void Cutter",d:63,cost:{scrap:420},icon:"🌀"},{name:"Thunder Lance",d:76,cost:{scrap:560},icon:"⚡"},{name:"Dawnbringer",d:92,cost:{scrap:750},icon:"🌅"}
];
const ARMOR=[
{name:"Patchwork Suit",a:2,cost:{scrap:20},icon:"🧥"},{name:"Ranger Weave",a:5,cost:{scrap:45},icon:"🥋"},{name:"Ceramic Shell",a:8,cost:{scrap:80},icon:"🛡️"},{name:"Titan Plate",a:12,cost:{scrap:140},icon:"🦾"},{name:"Solar Mantle",a:17,cost:{scrap:220},icon:"☀️"},{name:"Aegis Frame",a:23,cost:{scrap:330},icon:"🤖"},{name:"Stormguard Rig",a:30,cost:{scrap:470},icon:"🌩️"},{name:"Voidweave",a:39,cost:{scrap:650},icon:"🌀"},{name:"Dawn Exosuit",a:50,cost:{scrap:900},icon:"✨"}
];
const NAMES=["Mira","Jax","Tess","Rowan","Kade","Nia","Bram","Vera","Sol","Iris","Finn","Oren","Mae","Rook","Lena","Pax"];
const ENEMIES=[
{name:"Dust Mite",hp:24,d:6,xp:8,loot:8},{name:"Ash Hound",hp:38,d:9,xp:12,loot:14},{name:"Scrap Raider",hp:55,d:12,xp:18,loot:22},{name:"Glow Stalker",hp:75,d:15,xp:28,loot:30},{name:"Iron Brute",hp:105,d:20,xp:40,loot:50},{name:"Warden Beast",hp:150,d:25,xp:60,loot:80},{name:"Rift Marauder",hp:190,d:31,xp:78,loot:110},{name:"Glass Revenant",hp:240,d:38,xp:96,loot:145},{name:"Siege Automaton",hp:310,d:46,xp:120,loot:190},{name:"Ash Titan",hp:400,d:55,xp:150,loot:250},{name:"Starved Colossus",hp:520,d:65,xp:190,loot:330},{name:"The Hollow King",hp:700,d:78,xp:250,loot:500}
];
let token="";
let user=null, vaultId=null;
let G={};
let socket=null, roomCode="", myPlayer=null, suppressSync=false, authenticatedSocket=false;
function api(path,opts={}){opts.credentials="same-origin";opts.headers={...(opts.headers||{}),"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})};return fetch(path,opts).then(async r=>{let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j;});}
async function refreshSession(){const r=await fetch('/api/refresh',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'}});if(!r.ok)throw new Error('Session expired');const j=await r.json();token=j.access;user=j.user;return j;}
function showAuth(message=""){document.getElementById("app").innerHTML=`<div class="panel" style="max-width:480px;margin:12vh auto"><div class="brand">EMBER VAULT: AFTERLIGHT</div><h2>Online Vault</h2><p class="muted">Create an account or sign in. Your vault is saved on the game server.</p><input id="email" type="email" placeholder="Email" style="width:100%;padding:11px;margin:5px 0;background:#11191e;color:#fff;border:1px solid #465764;border-radius:7px"><input id="password" type="password" placeholder="Password (10+ characters)" style="width:100%;padding:11px;margin:5px 0;background:#11191e;color:#fff;border:1px solid #465764;border-radius:7px"><div class="controls" style="margin-top:8px"><button onclick="registerAccount()">Create Account</button><button onclick="loginAccount()">Sign In</button></div><div class="controls" style="margin-top:8px"><button onclick="forgotPassword()">Forgot Password</button></div><p id="authmsg" class="muted">${message}</p></div>`}
async function registerAccount(){try{const j=await api('/api/register',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});token=j.access;user=j.user;vaultId=j.vaultId;G=j.state;render();toast(j.message||'Account created. Check your email.');}catch(e){document.getElementById('authmsg').textContent=e.message}}
async function loginAccount(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});token=j.access;user=j.user;vaultId=j.vaultId;G=j.state;render();toast(j.message||'Signed in.');}catch(e){document.getElementById('authmsg').textContent=e.message}}
async function forgotPassword(){const email=document.getElementById('email').value;if(!email)return toast('Enter your email first.');try{const j=await api('/api/forgot-password',{method:'POST',body:JSON.stringify({email})});toast(j.message)}catch(e){toast(e.message)}}
async function logout(){try{await fetch('/api/logout',{method:'POST',credentials:'same-origin'})}catch{}token="";user=null;vaultId=null;if(socket)socket.close();showAuth()}
function save(){}
function serverUrl(){return (location.protocol==='https:'?'wss://':'ws://')+location.host}
function serverAction(action,payload={}){if(!socket||socket.readyState!==1)return toast('Connect to a co-op room first.');socket.send(JSON.stringify({type:'action',action,payload}));}
function connectServer(mode){if(!token)return toast('Sign in first.');if(!user?.verified)return toast('Verify your email first.');if(socket&&socket.readyState===1)socket.close();socket=new WebSocket(serverUrl());authenticatedSocket=false;socket.onopen=()=>{socket.send(JSON.stringify({type:'auth',token}));setNet('Authenticating…')};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='authed'){authenticatedSocket=true;if(mode==='create')socket.send(JSON.stringify({type:'create'}));else socket.send(JSON.stringify({type:'join',room:roomCode.trim().toUpperCase()}));return}if(m.type==='room'){roomCode=m.room;myPlayer=m.player;if(m.state){suppressSync=true;G=m.state;suppressSync=false}setNet('Room '+roomCode+' • Player '+myPlayer+' • '+(m.players||1)+'/2');render()}if(m.type==='players')setNet('Room '+roomCode+' • Player '+myPlayer+' • '+m.players+'/2');if(m.type==='state'&&m.state){suppressSync=true;G=m.state;suppressSync=false;render()}if(m.type==='error'){toast(m.message);setNet('Server error')}};socket.onclose=()=>setNet('Offline');socket.onerror=()=>setNet('Connection error');clearInterval(window.netPing);window.netPing=setInterval(()=>{if(socket&&socket.readyState===1)socket.send(JSON.stringify({type:'ping',t:Date.now()}))},20000)}
function setNet(x){let el=document.getElementById('net');if(el)el.textContent=x}function createRoom(){connectServer('create')}function joinRoom(){roomCode=(document.getElementById('roomInput')?.value||'').trim();if(roomCode.length<5)return toast('Enter a room code.');connectServer('join')}
function log(x){toast(x)}
function toast(x){let t=document.getElementById("toast");if(!t)return;t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2200)}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function newDweller(){
 let n=rand(NAMES), base={name:n,level:1,xp:0,hp:100,max:100,atk:5,def:2,weapon:0,armor:0,room:null,gender:Math.random()<.5?"A":"B",busy:false};
 return base;
}
if(!G.dwellers.length){G.dwellers=[newDweller(),newDweller(),newDweller(),newDweller()];G.dwellers[0].weapon=0;G.dwellers[1].weapon=0}
function cap(){return G.rooms.filter(r=>r.type==="hab").reduce((s,r)=>s+TYPES[r.type].cap*r.level,0)}
function production(){}
function advance(){}
setInterval(advance,1000);
function buyRoom(type){serverAction("build",{type});}
function upgrade(i){serverAction("upgrade",{index:i});}
function assign(did,ri){serverAction("assign",{dweller:did,room:ri});}
function recruit(){serverAction("recruit");}
function breed(a,b){serverAction("breed",{a,b});}
function craft(kind){serverAction("craft",{kind});}
function equip(did,kind,idx){serverAction("equip",{dweller:did,kind,index:idx});}
function stats(d){return {atk:d.atk+(WEAPONS[d.weapon]?.d||0),def:d.def+(ARMOR[d.armor]?.a||0)}}
function quest(zone){serverAction("quest");}
function reset(){if(confirm("Sign out of this account on this device?"))logout();}
function scene(chapter,title,text){document.getElementById("sceneChapter").textContent=chapter;document.getElementById("sceneTitle").textContent=title;document.getElementById("sceneText").textContent=text;document.getElementById("cutscene").style.display="flex"}
function closeScene(){document.getElementById("cutscene").style.display="none"}
function maybeScene(){if(!G)return;const seen=G.scenes||[];let key="day"+(G.day||1);if((G.day===1||G.day===3||G.day===7||G.zone===1||G.zone===5||G.zone===10)&&!seen.includes(key)){G.scenes=[...seen,key];scene(key.toUpperCase(),G.day===1?"The lights return":"A new chapter begins",G.day===1?"The Ember Vault wakes beneath a silent sky. Two survivors answer the emergency beacon, and the first room lights up.":`The vault has survived ${G.day} days. Beyond the blast doors, the wasteland is changing. Your next expedition could uncover the truth.`);}}
function render(){
 document.getElementById("app").innerHTML=`
 <div class="top"><div><div class="brand">EMBER VAULT: AFTERLIGHT</div><div class="muted">Online server-authoritative cooperative vault</div></div>
 <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><span id="net" class="pill">Offline</span><button onclick="createRoom()">Create Co-op</button><input id="roomInput" maxlength="6" placeholder="ROOM" style="width:80px;padding:8px;background:#11191e;color:#fff;border:1px solid #465764;border-radius:7px;text-transform:uppercase"><button onclick="joinRoom()">Join</button><span class="pill">${user?user.email:""}</span><button onclick="logout()">Sign out</button></div>
 <div class="stats"><span class="stat">🗓️ Day <b>${G.day}</b></span><span class="stat">🔩 <b>${G.scrap}</b></span><span class="stat">🥫 <b>${G.food}</b></span><span class="stat">💧 <b>${G.water}</b></span><span class="stat">⚡ <b>${G.power}</b></span><span class="stat">🩹 <b>${G.med}</b></span><span class="stat">👥 <b>${G.dwellers.length}/${cap()}</b></span></div></div>
 <div class="grid"><main class="panel">
 <div class="tabs">${["vault","people","build","quests","forge"].map(t=>`<button class="tab ${G.selectedTab===t?"active":""}" onclick="G.selectedTab='${t}';render()">${t.toUpperCase()}</button>`).join("")}</div>
 ${view()}
 </main><aside>
 <div class="panel"><h3>Co-op Crew</h3><div class="row"><span>Player 1</span><select id="p1" onchange="serverAction('setCrew',{p1:+this.value,p2:G.p2})">${selectDweller(G.p1)}</select></div><div class="row" style="margin-top:7px"><span>Player 2</span><select id="p2" onchange="serverAction('setCrew',{p1:G.p1,p2:+this.value})">${selectDweller(G.p2)}</select></div>
 <p class="muted">Two players share the same vault. Pick two dwellers and send them on a quest together.</p></div>
 <div class="panel"><h3>Vault Log</h3><div class="log">${G.logs.map(x=>`<div>${x}</div>`).join("")}</div><div style="margin-top:8px"><button onclick="reset()">Reset save</button></div></div>
 </aside></div><div class="footer">Original game concept and content. No Fallout/Bethesda characters, assets, names, factions, locations, or story are used.</div>`;
}
function selectDweller(v){return `<option value="-1">-- none --</option>`+G.dwellers.map((d,i)=>`<option value="${i}" ${v===i?"selected":""}>${d.name} Lv${d.level}${d.busy?" • busy":""}</option>`).join("")}
function view(){
 if(G.selectedTab==="vault")return `<div class="hero"><span class="badge">FREE • CO-OP • NO PREMIUM CURRENCY</span><h2 style="margin-top:8px">The Ember Vault</h2><p class="muted">Build your underground refuge, outfit your crew, and explore a world that keeps moving while you are away.</p><div class="visual-grid"><div class="vcard"><div class="big">🏗️</div><b>${G.rooms.length} modules</b><small class="muted">Your living machine</small></div><div class="vcard"><div class="big">🧑‍🤝‍🧑</div><b>${G.dwellers.length} dwellers</b><small class="muted">Two-player shared vault</small></div><div class="vcard"><div class="big">🗺️</div><b>Sector ${Math.min((G.zone||0)+1,12)}</b><small class="muted">${12-(G.zone||0)} major expeditions left</small></div></div></div><h2>Vault Core</h2><div class="roomgrid">${G.rooms.map((r,i)=>`<div class="room"><span class="lvl">LV ${r.level}</span><div class="icon">${TYPES[r.type].icon}</div><b>${TYPES[r.type].name}</b><small>${TYPES[r.type].desc}</small><button style="margin-top:7px" onclick="upgrade(${i})">Upgrade (${60*r.level} 🔩)</button></div>`).join("")}</div>`;
 if(G.selectedTab==="people")return `<h2>Dwellers</h2><div class="row"><span class="muted">${G.dwellers.length} residents • capacity ${cap()}</span><button onclick="recruit()">Recruit Wanderer</button></div><div class="list" style="margin-top:10px">${G.dwellers.map((d,i)=>{let s=stats(d);return `<div class="card"><div class="row"><b>${d.name}</b><span class="pill">Lv ${d.level} • ${d.gender}</span></div><div class="muted">HP ${d.hp}/${d.max} • ATK ${s.atk} • DEF ${s.def} • XP ${d.xp}/${d.level*25}</div><div class="meter"><i style="width:${100*d.hp/d.max}%"></i></div><div class="controls"><select onchange="assign(${i},+this.value)"><option value="-1">Unassigned</option>${G.rooms.map((r,j)=>`<option value="${j}" ${d.room===j?"selected":""}>${TYPES[r.type].name} ${j+1}</option>`).join("")}</select><button onclick="equip(${i},'weapon',${d.weapon===0?0:0})">Current weapon: ${WEAPONS[d.weapon].name}</button><button onclick="breed(${i},${G.dwellers.findIndex((x,j)=>j!==i&&!x.busy&&x.gender!==d.gender)})">Pair</button></div></div>`}).join("")}</div>`;
 if(G.selectedTab==="build")return `<h2>Construction</h2><div class="roomgrid">${Object.entries(TYPES).map(([k,t])=>`<div class="room"><div class="icon">${t.icon}</div><b>${t.name}</b><small>${t.desc}</small><p>Cost: ${Object.entries(t.cost).map(([a,b])=>b+" "+a).join(" • ")}</p><button onclick="buyRoom('${k}')">Build</button></div>`).join("")}</div>`;
 if(G.selectedTab==="quests")return `<h2>Outside Expeditions</h2><p class="muted">Zone ${G.zone+1} • Quest difficulty rises as you explore.</p><div class="map">${Array.from({length:15},(_,i)=>`<div class="zone ${i<G.zone?"done":""} ${i===G.zone?"active":""}">${i+1}. ${["Sunken Market","Rail Yard","Glass Marsh","Old Clinic","Cinder Bridge","Signal Tower","Ash Quarry","Black Orchard","Flooded Metro","Sky Farm","Red Basin","Hollow Dam","Night Foundry","Wrecked Arcology","The Long Dark"][i]}</div>`).join("")}</div><div class="card quest" style="margin-top:12px"><h3>Co-op Mission: ${ENEMIES[Math.min(G.zone,ENEMIES.length-1)].name}</h3><p>Send Player 1 and Player 2 together. They fight as a team and share the reward.</p><button onclick="quest()">Launch Expedition</button></div>`;
 return `<h2>Forge & Blueprints</h2><h3>Weapons</h3><div class="list">${WEAPONS.map((w,i)=>`<div class="card"><div class="row"><b>${w.name}</b><span class="pill">Damage ${w.d}</span></div><span class="muted">${G.weapons.includes(i)?"Unlocked":"Locked blueprint"}</span>${G.weapons.includes(i)?"":`<button onclick="craft('weapon')" ${i!==G.weapons.length?"disabled":""}>Craft ${w.cost.scrap} 🔩</button>`}</div>`).join("")}</div><h3 style="margin-top:12px">Armor</h3><div class="list">${ARMOR.map((w,i)=>`<div class="card"><div class="row"><b>${w.name}</b><span class="pill">Armor ${w.a}</span></div><span class="muted">${G.armors.includes(i)?"Unlocked":"Locked blueprint"}</span>${G.armors.includes(i)?"":`<button onclick="craft('armor')" ${i!==G.armors.length?"disabled":""}>Craft ${w.cost.scrap} 🔩</button>`}</div>`).join("")}</div>`;
}
async function handleAccountLink(){const q=new URLSearchParams(location.search);const verify=q.get('verify');const reset=q.get('reset');if(verify){try{await api('/api/verify-email',{method:'POST',body:JSON.stringify({token:verify})});history.replaceState({},'',location.pathname);toast('Email verified. You can sign in.')}catch(e){toast(e.message)}}if(reset){document.getElementById('app').innerHTML=`<div class="panel" style="max-width:480px;margin:12vh auto"><div class="brand">EMBER VAULT: AFTERLIGHT</div><h2>Reset Password</h2><input id="newpass" type="password" placeholder="New password (10+ characters)" style="width:100%;padding:11px;margin:8px 0;background:#11191e;color:#fff;border:1px solid #465764;border-radius:7px"><button onclick="finishReset(${JSON.stringify(reset)})">Set New Password</button><p id="authmsg" class="muted"></p></div>`;return true}return false}
async function finishReset(t){try{await api('/api/reset-password',{method:'POST',body:JSON.stringify({token:t,password:document.getElementById('newpass').value})});history.replaceState({},'',location.pathname);showAuth('Password changed. Sign in with your new password.')}catch(e){document.getElementById('authmsg').textContent=e.message}}
async function boot(){
 if(await handleAccountLink())return;
 try{const j=await refreshSession();const me=await api('/api/me');user=me.user;vaultId=me.vaultId;G=me.state;render();if(!user.verified)toast('Check your email to verify your account.');}
 catch(e){token='';showAuth();}
}
boot();
</script></body></html>
