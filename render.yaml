services:
  - type: web
    name: ember-vault-afterlight
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ember-vault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ember-vault-redis
          type: keyvalue
          property: connectionString
      - key: PUBLIC_URL
        fromService:
          name: ember-vault-afterlight
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SECURE
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: keyvalue
    name: ember-vault-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render web service access
    maxmemoryPolicy: noeviction
    persistenceMode: off

databases:
  - name: ember-vault-db
    plan: free
